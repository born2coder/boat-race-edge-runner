name: Observe all-race EDGE candidates

on:
  push:
    branches: [main]
    paths:
      - scripts/edge_shadow.py
      - scripts/watch_edge.py
      - scripts/send_payload.py
      - tests/test_edge_workflow.py
      - requirements.txt
      - .github/workflows/edge.yml
      - .github/workflows/results.yml
  schedule:
    # GitHub Actions cron is UTC. Start ahead of the first race window and avoid
    # the busiest top-of-hour slots. These run at 07:47, 13:37, and 19:07 JST.
    # Three overlapping watchers cover the service day and check every 3 minutes.
    - cron: "47 22 * * *"
    - cron: "37 4 * * *"
    - cron: "7 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-race-edge-shadow
  # A newly deployed observer must replace the old long-running process so the
  # latest measurement logic starts before the next race window.
  cancel-in-progress: true

jobs:
  observe:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Test runner
        run: python -m unittest discover -s tests -v
      - name: Observe all races independently from morning picks
        env:
          PYTHONUNBUFFERED: "1"
          EDGE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
          EDGE_SITE_INGEST_ENDPOINT: ${{ secrets.EDGE_SITE_INGEST_ENDPOINT }}
          EDGE_SITE_INGEST_SECRET: ${{ secrets.EDGE_SITE_INGEST_SECRET }}
        run: python scripts/watch_edge.py
