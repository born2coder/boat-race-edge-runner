name: Observe all-race EDGE candidates

on:
  push:
    branches: [main]
    paths:
      - scripts/edge_shadow.py
      - scripts/watch_edge.py
      - scripts/send_payload.py
      - requirements.txt
      - .github/workflows/edge.yml
  schedule:
    # Three non-overlapping watchers cover the service day and check every 3 minutes.
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
    - cron: "30 13 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 19 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-race-edge-shadow
  cancel-in-progress: false

jobs:
  observe:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Test runner
        run: python -m unittest discover -s tests -v
      - name: Observe all races independently from morning picks
        env:
          PYTHONUNBUFFERED: "1"
          EDGE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
          EDGE_SITE_INGEST_ENDPOINT: ${{ secrets.EDGE_SITE_INGEST_ENDPOINT }}
          EDGE_SITE_INGEST_SECRET: ${{ secrets.EDGE_SITE_INGEST_SECRET }}
        run: python scripts/watch_edge.py
