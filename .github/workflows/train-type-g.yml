name: Freeze HIT type-G model

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/train_type_g.py
      - validation/female_racer_ids.json
      - .github/workflows/train-type-g.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out type-G branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Train and encrypt frozen type-G stage 1
        env:
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
        run: python scripts/train_type_g.py
      - name: Upload encrypted model and safe manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hit-type-g-v1
          path: validation-output/type-g-model
          if-no-files-found: error
          retention-days: 14
