name: Record bounded prospective research
on:
  schedule:
    # 07:17, 12:17, 17:17 JST; overlapping healthy runs serialize.
    - cron: "17 22,3,8 * * *"
  workflow_dispatch:
    inputs:
      once:
        description: One bounded verification tick
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: boat-race-research-forward
  cancel-in-progress: false
jobs:
  record:
    if: github.event.repository.visibility == 'public' && vars.EDGE_AUTOMATION_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Observe and record new research only
        env:
          PYTHONUNBUFFERED: "1"
          EDGE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
          EDGE_SITE_INGEST_ENDPOINT: ${{ secrets.EDGE_SITE_INGEST_ENDPOINT }}
          EDGE_SITE_INGEST_SECRET: ${{ secrets.EDGE_SITE_INGEST_SECRET }}
          RESEARCH_FORWARD_ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.once && '1' || '0' }}
          OMP_NUM_THREADS: "1"
        run: python scripts/watch_research_forward.py
