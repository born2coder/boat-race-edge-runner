name: Publish official BOAT RACE results

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_results.py
      - requirements-results.txt
      - tests/test_edge_workflow.py
      - .github/workflows/results.yml
  schedule:
    - cron: "17 21-23,0-13 * * *"
  workflow_dispatch:
    inputs:
      service_date:
        description: "再取得する開催日（YYYY-MM-DD、空欄は本日）"
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: boat-race-edge-results
  cancel-in-progress: false

jobs:
  publish-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-results.txt

      - name: Install parser dependency
        run: python -m pip install --requirement requirements-results.txt

      - name: Publish today's programs and results
        env:
          EDGE_SITE_INGEST_ENDPOINT: ${{ secrets.EDGE_SITE_INGEST_ENDPOINT }}
          EDGE_SITE_INGEST_SECRET: ${{ secrets.EDGE_SITE_INGEST_SECRET }}
          TZ: Asia/Tokyo
        run: |
          service_date="${{ inputs.service_date }}"
          if [ -z "$service_date" ]; then service_date="$(date +%F)"; fi
          python scripts/sync_results.py --no-legacy-predictions --date "$service_date"

      - name: Ensure EDGE observer is running
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service_date == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TZ: Asia/Tokyo
        run: |
          hour="$(date +%H)"
          if [ "$hour" -lt 7 ] || [ "$hour" -ge 22 ]; then
            echo "Outside EDGE service hours; recovery is not needed."
            exit 0
          fi

          runs_api="https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/edge.yml/runs?per_page=20"
          active_runs="$(
            curl --silent --show-error --fail               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${GH_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               "$runs_api" |
            python -c 'import json, sys; print(sum(run.get("status") in {"queued", "in_progress"} for run in json.load(sys.stdin).get("workflow_runs", [])))'
          )"

          if [ "$active_runs" -gt 0 ]; then
            echo "EDGE observer is already queued or running."
            exit 0
          fi

          echo "EDGE observer is missing; dispatching recovery run."
          curl --silent --show-error --fail             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             --data '{"ref":"main"}'             "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/edge.yml/dispatches"
