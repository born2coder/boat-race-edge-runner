name: Publish official BOAT RACE results

on:
  schedule:
    - cron: "17 21-23,0-13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-race-edge-results
  cancel-in-progress: false

jobs:
  publish-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-results.txt

      - name: Install parser dependency
        run: python -m pip install --requirement requirements-results.txt

      - name: Publish today's programs and results
        env:
          EDGE_SITE_INGEST_ENDPOINT: ${{ secrets.EDGE_SITE_INGEST_ENDPOINT }}
          EDGE_SITE_INGEST_SECRET: ${{ secrets.EDGE_SITE_INGEST_SECRET }}
          TZ: Asia/Tokyo
        run: |
          python scripts/sync_results.py --no-legacy-predictions --date "$(date +%F)"
          python scripts/sync_results.py --no-legacy-predictions --date "$(date -d yesterday +%F)"

