name: Validate production HIT gender handling

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/validate_production_gender.py
      - validation/female_racer_ids.json
      - .github/workflows/production-gender-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run aggregate-only comparison
        env:
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
          EDGE_VALIDATION_END: "2026-09-07"
        run: python scripts/validate_production_gender.py
      - name: Upload aggregate results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-gender-validation
          path: validation-output/production-gender
          if-no-files-found: error
          retention-days: 14
