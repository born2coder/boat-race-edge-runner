name: Validate full120 frozen model contract
on:
  push:
    branches: [edge-refresh-v2]
    paths: ["scripts/edge_v2*.py", "scripts/smoke_edge_v2.py", ".github/workflows/edge-v2-contract.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Check both frozen distributions and original top8 alignment
        env:
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
          OMP_NUM_THREADS: "1"
        run: python scripts/smoke_edge_v2.py
