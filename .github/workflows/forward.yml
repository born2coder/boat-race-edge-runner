name: Publish frozen HIT predictions

on:
  schedule:
    - cron: "*/5 6-22 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-race-edge-forward
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Prepare morning predictions and exhibition badges
        id: prepare
        env:
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
        run: python scripts/prepare_forward.py

      - name: Lock prediction state before publication
        if: steps.prepare.outputs.pending == 'true'
        env:
          STATE_FILE: ${{ steps.prepare.outputs.state_file }}
        run: |
          git config user.name "boat-race-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$STATE_FILE"
          git commit -m "Lock forward predictions"
          git pull --rebase
          git push

      - name: Publish signed payload
        if: steps.prepare.outputs.pending == 'true'
        env:
          EDGE_SITE_INGEST_ENDPOINT: ${{ secrets.EDGE_SITE_INGEST_ENDPOINT }}
          EDGE_SITE_INGEST_SECRET: ${{ secrets.EDGE_SITE_INGEST_SECRET }}
        run: python scripts/send_payload.py .runtime/payload.json

      - name: Record successful publication
        if: steps.prepare.outputs.pending == 'true'
        env:
          STATE_FILE: ${{ steps.prepare.outputs.state_file }}
        run: |
          python scripts/mark_published.py "$STATE_FILE"
          git add -- "$STATE_FILE"
          git commit -m "Record forward publication"
          git pull --rebase
          git push
