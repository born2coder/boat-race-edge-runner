name: Publish frozen HIT predictions

on:
  push:
    branches: [main]
    paths:
      - scripts/prepare_forward.py
      - scripts/watch_forward.py
      - scripts/send_payload.py
      - scripts/mark_published.py
      - requirements.txt
      - .github/workflows/forward.yml
  schedule:
    # Starts/wakes a watcher. Once running, it polls itself every minute.
    - cron: "7,37 5-21 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-race-edge-forward
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Test runner safety and missing preview handling
        run: python -m unittest discover -s tests -v

      - name: Watch selected races and publish timely exhibition badges
        env:
          PYTHONUNBUFFERED: "1"
          EDGE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          EDGE_MODEL_REPOSITORY: ${{ secrets.EDGE_MODEL_REPOSITORY }}
          EDGE_MODEL_TOKEN: ${{ secrets.EDGE_MODEL_TOKEN }}
          EDGE_MODEL_KEY: ${{ secrets.EDGE_MODEL_KEY }}
          EDGE_SITE_INGEST_ENDPOINT: ${{ secrets.EDGE_SITE_INGEST_ENDPOINT }}
          EDGE_SITE_INGEST_SECRET: ${{ secrets.EDGE_SITE_INGEST_SECRET }}
        run: python scripts/watch_forward.py
